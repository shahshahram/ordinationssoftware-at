# Permission-Format
format:
  pattern: "resource.action"
  example: "patient.read"
  note: "Verwenden Sie Singular für Resources (patient, nicht patients)"

# Validierung
validation:
  strict: true
  allowWildcards: true
  normalizePlural: true  # Automatische Konvertierung von Plural zu Singular
