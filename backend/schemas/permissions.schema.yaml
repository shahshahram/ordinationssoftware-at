  document:
    label: "Dokument"
    description: "Medizinische Dokumente"
    sensitive: true
  
  diagnosis:
    label: "Diagnose"
    description: "Diagnosen"
    sensitive: true
  
  prescription:
    label: "Rezept"
    description: "Verschreibungen"
    sensitive: true
  
  billing:
    label: "Abrechnung"
    description: "Rechnungen und Abrechnungen"
    sensitive: true
  
  user:
    label: "Benutzer"
    description: "System-Benutzer"
    sensitive: true
  
  role:
    label: "Rolle"
    description: "RBAC-Rollen"
    sensitive: false
  
  location:
    label: "Standort"
    description: "Ordinations-Standorte"
    sensitive: false
  
  service:
    label: "Leistung"
    description: "Medizinische Leistungen"
    sensitive: false
  
  template:
    label: "Vorlage"
    description: "Dokument-Vorlagen"
    sensitive: false
  
  staff:
    label: "Personal"
    description: "Mitarbeiter"
    sensitive: true
  
  audit_log:
    label: "Audit-Log"
    description: "Audit-Protokolle"
    sensitive: true
  
  system:
    label: "System"
    description: "System-Konfiguration"
    sensitive: true
  
  inventory:
    label: "Inventar"
