# Ordinationssoftware - Nginx Konfiguration für mymedicloud.at
# Kopieren nach: /etc/nginx/sites-available/ordinationssoftware
# Aktivieren: sudo ln -sf /etc/nginx/sites-available/ordinationssoftware /etc/nginx/sites-enabled/

# Basis-Pfad der Anwendung
# APP_ROOT=/home/ordinationssoftware/ordinationssoftware-at

# ============================================================
# A) Variante HTTP (für ersten Test oder vor Certbot)
# ============================================================
# Diese Variante auskommentieren, wenn SSL aktiv ist (B)

server {
    listen 80;
    server_name mymedicloud.at www.mymedicloud.at;

    # ACME Challenge für Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Frontend (React Build)
    location / {
        root /home/ordinationssoftware/ordinationssoftware-at/frontend/build;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Datei-Uploads (größere Timeouts)
    location /api/upload {
        proxy_pass http://localhost:5001;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # WebSocket Support
    location /socket.io {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

